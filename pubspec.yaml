name: shell_mind
description: "SSH + AI Assistant mobile app built with Flutter"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dartssh2: ^2.11.0
  xterm: ^4.0.0
  dio: ^5.7.0
  hive_ce: ^2.7.0
  hive_ce_flutter: ^2.2.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  hive_ce_generator: ^1.9.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
