name: Release APK

# Trigger: push a tag like v1.5.0 -> build signed release APKs and attach them
# to the GitHub Release. Since the switch to `--split-per-abi`, three per-ABI
# APKs are produced and uploaded under a versioned, ABI-tagged naming scheme:
#   Shell-Mind-v{version}-{abi}.apk   (arm64-v8a / armeabi-v7a / x86_64)
# The in-app updater (see lib/core/services/update_service.dart +
# lib/core/utils/release_selector.dart) picks the asset whose name carries the
# device ABI first, then falls back to universal / static preference order, so
# the naming below is load-bearing - do not change it casually.
on:
  push:
    tags:
      - 'v*'

# Needed by softprops/action-gh-release to create/update the release.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build signed release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the locally verified toolchain (pubspec requires Dart ^3.13.4).
          # If this version is not found on the stable channel, drop `channel: stable`.
          flutter-version: 3.47.5
          channel: stable
          cache: true

      # Fail fast (before any build work) if the user forgot to configure the
      # repository secrets. Otherwise the build would silently fall back to the
      # debug signing config (see android/app/build.gradle.kts) and publish a
      # debug-signed APK.
      - name: Guard signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES_B64: ${{ secrets.KEY_PROPERTIES_BASE64 }}
        run: |
          missing=0
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set. Add it under repo Settings > Secrets and variables > Actions: base64 of the release .jks (PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes('<path to .jks>')))"
            missing=1
          fi
          if [ -z "$KEY_PROPERTIES_B64" ]; then
            echo "::error::Secret KEY_PROPERTIES_BASE64 is not set. Add it under repo Settings > Secrets and variables > Actions: base64 of android/key.properties (PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes('<path to key.properties>')))"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      # Decode the base64-encoded credentials from GitHub Secrets.
      # The keystore is written to android/app/ because build.gradle.kts resolves
      # `storeFile` relative to the app module dir. `storeFile` is force-corrected
      # so the workflow works regardless of how the local key.properties referred
      # to the keystore (absolute path, ..\, etc.).
      - name: Restore signing credentials
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES_B64: ${{ secrets.KEY_PROPERTIES_BASE64 }}
        run: |
          # tr strips newlines/CR/spaces so the decode works whether the base64
          # was produced by certutil (CRLF-wrapped) or PowerShell (single line).
          printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > android/app/shellmind-release-key.jks
          printf '%s' "$KEY_PROPERTIES_B64" | tr -d ' \r\n' | base64 -d > android/key.properties
          sed -i 's|^storeFile=.*|storeFile=shellmind-release-key.jks|' android/key.properties
          test -s android/app/shellmind-release-key.jks || { echo "::error::Decoded keystore is empty - KEYSTORE_BASE64 is probably not raw base64 of the .jks"; exit 1; }
          test -s android/key.properties || { echo "::error::Decoded key.properties is empty - KEY_PROPERTIES_BASE64 is probably not raw base64 of the file"; exit 1; }

      - name: Install dependencies
        run: flutter pub get

      # Refuse to publish when the tag and pubspec version disagree (e.g. tagged
      # v1.5.0 while pubspec still says 1.4.1+8). Bump the version first, then tag.
      - name: Verify tag matches pubspec version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PUBSPEC_VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//; s/+.*$//')
          TAG_VERSION=${TAG#v}
          echo "pubspec version: $PUBSPEC_VERSION | tag version: $TAG_VERSION"
          if [ "$PUBSPEC_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag '$TAG' does not match pubspec version '$PUBSPEC_VERSION'. Update pubspec.yaml (and app_constants.dart) first, then re-tag."
            exit 1
          fi
          echo "VERSION=$PUBSPEC_VERSION" >> "$GITHUB_ENV"

      # Test gate: fail fast before any build work when analyze or tests fail.
      - name: "Test gate: pub get"
        run: flutter pub get

      - name: "Test gate: analyze"
        run: flutter analyze

      - name: "Test gate: test"
        run: flutter test

      # One APK per ABI: app-{abi}-release.apk (arm64-v8a, armeabi-v7a, x86_64).
      - name: Build per-ABI release APKs
        run: flutter build apk --release --split-per-abi

      # Rename every per-ABI artifact to the load-bearing updater scheme and
      # fail the build if any expected ABI build is missing.
      - name: Rename APK assets
        run: |
          cd build/app/outputs/flutter-apk
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            SRC="app-${ABI}-release.apk"
            test -s "$SRC" || { echo "::error::Expected per-ABI artifact $SRC not found after build"; exit 1; }
            cp "$SRC" "Shell-Mind-v${VERSION}-${ABI}.apk"
          done
          ls -la

      # GitHub now exposes a native `digest` (sha256:<hex>) for every uploaded
      # release asset, which the in-app updater already parses (first wave).
      # SHA256SUMS.txt additionally ships the bare-hex checksums so they can be
      # verified by hand outside the app.
      - name: Generate SHA256 checksums
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum Shell-Mind-v${VERSION}-*.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Extract the release notes for the current version from CHANGELOG.md
      # (a hand-written, human-readable Chinese description) instead of relying
      # solely on GitHub's auto-generated English commit/PR summary. Falls back
      # to a minimal body if the version section is missing.
      - name: Prepare release notes
        run: |
          awk -v ver="${VERSION}" '
            BEGIN { found = 0 }
            $0 ~ ("## \\[" ver "\\]") { found = 1 }
            found && $0 ~ /^## \[/ && !($0 ~ ("\\[" ver "\\]")) { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "ShellMind v${VERSION}" > release_notes.md
          fi
          echo "--- release notes ---"
          cat release_notes.md

      - name: Upload APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Shell-Mind v${{ env.VERSION }}
          body_path: release_notes.md
          fail_on_unmatched_files: true
          files: |
            build/app/outputs/flutter-apk/Shell-Mind-v${{ env.VERSION }}-arm64-v8a.apk
            build/app/outputs/flutter-apk/Shell-Mind-v${{ env.VERSION }}-armeabi-v7a.apk
            build/app/outputs/flutter-apk/Shell-Mind-v${{ env.VERSION }}-x86_64.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
